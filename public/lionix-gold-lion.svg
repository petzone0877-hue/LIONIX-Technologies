<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1C5"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagonal Shield Base -->
  <polygon points="100,8 185,55 185,145 100,192 15,145 15,55" fill="#0D0F15" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <polygon points="100,18 173,59 173,141 100,182 27,141 27,59" fill="#07080B" stroke="#B45309" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Stylized Geometric Lion Head & Crown -->
  <!-- Crown / Mane Crest -->
  <path d="M100 26 L112 44 L132 36 L124 56 L144 54 L130 72 L100 66 L70 72 L56 54 L76 56 L68 36 L88 44 Z" fill="url(#goldGrad)"/>
  
  <!-- Forehead / Brow -->
  <polygon points="100,68 126,80 100,94 74,80" fill="#FBBF24"/>
  <polygon points="100,94 116,86 100,118 84,86" fill="url(#goldGrad)"/>

  <!-- Eyes - High Tech Cyan/Gold Glowing Slits -->
  <polygon points="76,86 88,90 85,93 74,90" fill="#FFF1C5"/>
  <polygon points="124,86 112,90 115,93 126,90" fill="#FFF1C5"/>

  <!-- Nose & Snout -->
  <polygon points="100,118 107,130 93,130" fill="#111319" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="100" y1="130" x2="100" y2="142" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Cheeks & Lower Mane Facets -->
  <polygon points="66,88 74,108 52,122 46,98" fill="url(#goldGrad)" fill-opacity="0.9"/>
  <polygon points="134,88 126,108 148,122 154,98" fill="url(#goldGrad)" fill-opacity="0.9"/>

  <polygon points="74,108 90,132 78,148 52,122" fill="#B45309"/>
  <polygon points="126,108 110,132 122,148 148,122" fill="#B45309"/>

  <!-- Chin & Jaws -->
  <polygon points="90,134 100,144 110,134 100,154" fill="url(#goldGrad)"/>
  <polygon points="86,146 100,166 114,146 100,154" fill="#F59E0B"/>

  <!-- Circuit Trace Accents -->
  <circle cx="100" cy="18" r="2.5" fill="#FFF1C5"/>
  <circle cx="185" cy="55" r="2.5" fill="#FFF1C5"/>
  <circle cx="15" cy="55" r="2.5" fill="#FFF1C5"/>
  <circle cx="185" cy="145" r="2.5" fill="#FFF1C5"/>
  <circle cx="15" cy="145" r="2.5" fill="#FFF1C5"/>
  <circle cx="100" cy="192" r="2.5" fill="#FFF1C5"/>
</svg>
